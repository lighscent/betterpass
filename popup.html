<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
    <a
      href="https://github.com/lighscent/betterpass"
      target="_blank"
      class="github-link"
    >
      <span class="material-icons">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="currentColor"
        >
          <path
            d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"
          />
        </svg>
      </span>
    </a>
    <div class="theme-switch">
      <button id="theme-toggle" title="Changer de thème">
        <span class="material-icons sun">light_mode</span>
        <span class="material-icons moon">dark_mode</span>
      </button>
    </div>
    <div id="update-notification" class="update-banner">
      <div class="update-content">
        <span class="material-icons update-icon">system_update</span>
        <div class="update-text">
          <strong>Mise à jour disponible!</strong> <span id="update-version"></span>
          <a href="https://github.com/lighscent/betterpass/releases/latest" target="_blank">
            Cliquez ici pour télécharger
          </a>
        </div>
      </div>
      <button id="close-update" class="close-update">
        <span class="material-icons">close</span>
      </button>
    </div>
    <h3>BetterPass</h3>
    <div class="password-container">
      <input type="text" id="password" readonly />
      <div class="button-container">
        <button id="generate">
          <span class="material-icons">vpn_key</span>
          Générer
        </button>
        <button id="copy">
          <span class="material-icons">content_copy</span>
          Copier
        </button>
      </div>
    </div>
    <div class="options-container">
      <div class="option-group">
        <label>Longueur: <span id="lengthValue">16</span> caractères</label>
        <input type="range" id="length" min="8" max="50" value="16" />
      </div>
      <div class="option-group">
        <label>Options:</label>
        <div class="checkbox-group">
          <label class="checkbox-label">
            <div class="toggle-container">
              <span class="material-icons">text_fields</span>
              <span>Majuscules</span>
            </div>
            <label class="toggle-switch">
              <input type="checkbox" id="uppercase" checked />
              <span class="slider"></span>
            </label>
          </label>

          <label class="checkbox-label">
            <div class="toggle-container">
              <span class="material-icons">format_size</span>
              <span>Minuscules</span>
            </div>
            <label class="toggle-switch">
              <input type="checkbox" id="lowercase" checked />
              <span class="slider"></span>
            </label>
          </label>

          <label class="checkbox-label">
            <div class="toggle-container">
              <span class="material-icons">tag</span>
              <span>Chiffres</span>
            </div>
            <label class="toggle-switch">
              <input type="checkbox" id="numbers" checked />
              <span class="slider"></span>
            </label>
          </label>

          <label class="checkbox-label">
            <div class="toggle-container">
              <span class="material-icons">star</span>
              <span>Symboles</span>
            </div>
            <label class="toggle-switch">
              <input type="checkbox" id="symbols" checked />
              <span class="slider"></span>
            </label>
          </label>
        </div>
      </div>
    </div>
    <div class="toast" id="toast">Mot de passe copié !</div>
    <script src="popup.js"></script>
  </body>
</html>
